<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
 
  /* ---------- LOGIN ---------- */
  .login-box {
    background: #fff;
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    text-align: center;
  }
  .login-box h1 { font-size: 22px; color: #1e293b; margin-bottom: 6px; }
  .login-box p { color: #64748b; font-size: 13px; margin-bottom: 24px; }
  .login-box input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .login-box input:focus { border-color: #4f46e5; }
  .login-box button {
    width: 100%;
    padding: 12px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: #4338ca; }
  .error-msg { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 16px; }
  .hint { margin-top: 18px; font-size: 12px; color: #94a3b8; }
 
  /* ---------- APP ---------- */
  .app-container { display: none; width: 100%; max-width: 1100px; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 16px 24px;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }
  .topbar h2 { color: #1e293b; font-size: 20px; }
  .logout-btn {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .logout-btn:hover { background: #dc2626; }
 
  .panel {
    background: #fff;
    border-radius: 0 0 12px 12px;
    padding: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }
 
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .form-grid input, .form-grid select {
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .form-grid input:focus, .form-grid select:focus { border-color: #4f46e5; }
 
  .btn-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-secondary { background: #e2e8f0; color: #334155; }
  .btn-secondary:hover { background: #cbd5e1; }
 
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .search-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
  }
 
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 10px 12px;
    background: #f1f5f9;
    color: #475569;
    font-weight: 600;
    border-bottom: 2px solid #e2e8f0;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #e2e8f0;
    color: #334155;
  }
  tbody tr:hover { background: #f8fafc; }
  .actions button {
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 6px;
  }
  .edit-btn { background: #fbbf24; color: #fff; }
  .del-btn { background: #ef4444; color: #fff; }
  .empty-msg { text-align: center; padding: 30px; color: #94a3b8; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    flex: 1;
    min-width: 140px;
    background: #eef2ff;
    padding: 16px;
    border-radius: 10px;
    text-align: center;
  }
  .stat-card .num { font-size: 24px; font-weight: 700; color: #4f46e5; }
  .stat-card .label { font-size: 12px; color: #64748b; margin-top: 4px; }
</style>
</head>
<body>
 
<!-- LOGIN PAGE -->
<div class="login-box" id="loginBox">
  <h1>Student Management System</h1>
  <p>Please login to continue</p>
  <input type="text" id="loginId" placeholder="ID (e.g. admin)">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="handleLogin()">Login</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="hint">Default login → ID: <b>admin</b> &nbsp; Password: <b>admin123</b></div>
</div>
 
<!-- MAIN APP -->
<div class="app-container" id="appContainer">
  <div class="topbar">
    <h2>🎓 Student Management Dashboard</h2>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>
 
  <div class="panel">
    <div class="stats">
      <div class="stat-card"><div class="num" id="totalStudents">0</div><div class="label">Total Students</div></div>
      <div class="stat-card"><div class="num" id="totalClasses">0</div><div class="label">Classes</div></div>
      <div class="stat-card"><div class="num" id="avgMark">0</div><div class="label">Average Marks</div></div>
    </div>
 
    <div class="form-grid">
      <input type="hidden" id="studentId">
      <input type="text" id="studentName" placeholder="Full Name">
      <input type="text" id="studentRoll" placeholder="Roll / Register No.">
      <input type="text" id="studentClass" placeholder="Class / Grade">
      <input type="email" id="studentEmail" placeholder="Email">
      <input type="tel" id="studentPhone" placeholder="Phone">
      <input type="number" id="studentMarks" placeholder="Marks (0-100)">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveStudent()" id="saveBtn">➕ Add Student</button>
      <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
    </div>
 
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="🔍 Search by name, roll no, or class..." oninput="renderStudents()">
    </div>
 
    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Class</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Marks</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg" style="display:none;">No students found. Add one above ⬆️</div>
  </div>
</div>
 
<script>
  // ---------- CONFIG (change these to your own credentials) ----------
  const DEFAULT_CREDENTIALS = { id: "22042007", password: "22-04-2007" };
 
  // ---------- STORAGE HELPERS ----------
  function getCredentials() {
    const stored = localStorage.getItem("sms_credentials");
    return stored ? JSON.parse(stored) : DEFAULT_CREDENTIALS;
  }
  function getStudents() {
    const stored = localStorage.getItem("sms_students");
    return stored ? JSON.parse(stored) : [];
  }
  function saveStudents(list) {
    localStorage.setItem("sms_students", JSON.stringify(list));
  }
 
  // ---------- LOGIN ----------
  function handleLogin() {
    const id = document.getElementById("loginId").value.trim();
    const pw = document.getElementById("loginPassword").value.trim();
    const creds = getCredentials();
    const errorMsg = document.getElementById("errorMsg");
 
    if (id === creds.id && pw === creds.password) {
      errorMsg.textContent = "";
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("appContainer").style.display = "block";
      sessionStorage.setItem("sms_logged_in", "true");
      renderStudents();
    } else {
      errorMsg.textContent = "Invalid ID or password. Try again.";
    }
  }
 
  function handleLogout() {
    sessionStorage.removeItem("sms_logged_in");
    document.getElementById("appContainer").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("loginId").value = "";
    document.getElementById("loginPassword").value = "";
  }
 
  // auto-login if session active (persists on refresh, not after browser close)
  window.onload = function () {
    if (sessionStorage.getItem("sms_logged_in") === "true") {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("appContainer").style.display = "block";
      renderStudents();
    }
  };
 
  // allow Enter key to submit login
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && document.getElementById("loginBox").style.display !== "none") {
      handleLogin();
    }
  });
 
  // ---------- STUDENT CRUD ----------
  function saveStudent() {
    const id = document.getElementById("studentId").value;
    const name = document.getElementById("studentName").value.trim();
    const roll = document.getElementById("studentRoll").value.trim();
    const cls = document.getElementById("studentClass").value.trim();
    const email = document.getElementById("studentEmail").value.trim();
    const phone = document.getElementById("studentPhone").value.trim();
    const marks = document.getElementById("studentMarks").value.trim();
 
    if (!name || !roll) {
      alert("Name and Roll No. are required.");
      return;
    }
 
    let students = getStudents();
 
    if (id) {
      // edit existing
      students = students.map(s => s.uid === id ? { ...s, name, roll, cls, email, phone, marks } : s);
    } else {
      // add new
      students.push({
        uid: Date.now().toString(),
        name, roll, cls, email, phone, marks
      });
    }
 
    saveStudents(students);
    clearForm();
    renderStudents();
  }
 
  function editStudent(uid) {
    const students = getStudents();
    const s = students.find(x => x.uid === uid);
    if (!s) return;
    document.getElementById("studentId").value = s.uid;
    document.getElementById("studentName").value = s.name;
    document.getElementById("studentRoll").value = s.roll;
    document.getElementById("studentClass").value = s.cls;
    document.getElementById("studentEmail").value = s.email;
    document.getElementById("studentPhone").value = s.phone;
    document.getElementById("studentMarks").value = s.marks;
    document.getElementById("saveBtn").textContent = "💾 Update Student";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
 
  function deleteStudent(uid) {
    if (!confirm("Delete this student record?")) return;
    let students = getStudents();
    students = students.filter(s => s.uid !== uid);
    saveStudents(students);
    renderStudents();
  }
 
  function clearForm() {
    document.getElementById("studentId").value = "";
    document.getElementById("studentName").value = "";
    document.getElementById("studentRoll").value = "";
    document.getElementById("studentClass").value = "";
    document.getElementById("studentEmail").value = "";
    document.getElementById("studentPhone").value = "";
    document.getElementById("studentMarks").value = "";
    document.getElementById("saveBtn").textContent = "➕ Add Student";
  }
 
  function renderStudents() {
    const students = getStudents();
    const search = document.getElementById("searchBox").value.toLowerCase();
    const filtered = students.filter(s =>
      s.name.toLowerCase().includes(search) ||
      s.roll.toLowerCase().includes(search) ||
      (s.cls || "").toLowerCase().includes(search)
    );
 
    const tbody = document.getElementById("studentTableBody");
    tbody.innerHTML = "";
 
    document.getElementById("emptyMsg").style.display = filtered.length ? "none" : "block";
 
    filtered.forEach(s => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${s.roll}</td>
        <td>${s.name}</td>
        <td>${s.cls || "-"}</td>
        <td>${s.email || "-"}</td>
        <td>${s.phone || "-"}</td>
        <td>${s.marks || "-"}</td>
        <td class="actions">
          <button class="edit-btn" onclick="editStudent('${s.uid}')">Edit</button>
          <button class="del-btn" onclick="deleteStudent('${s.uid}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
 
    // stats
    document.getElementById("totalStudents").textContent = students.length;
    const classes = new Set(students.map(s => s.cls).filter(Boolean));
    document.getElementById("totalClasses").textContent = classes.size;
    const marksArr = students.map(s => parseFloat(s.marks)).filter(n => !isNaN(n));
    const avg = marksArr.length ? (marksArr.reduce((a, b) => a + b, 0) / marksArr.length).toFixed(1) : 0;
    document.getElementById("avgMark").textContent = avg;
  }
</script>
 
</body>
</html>
